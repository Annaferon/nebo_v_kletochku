name: agents

on:
  schedule:
    # Время UTC. МСК = UTC+3.
    - cron: '0 2 * * *'      # 05:00 МСК — Writer (3 варианта)
    - cron: '0 18 * * *'     # 21:00 МСК — Stats
    - cron: '*/15 * * * *'   # каждые 15 минут — обработка кнопок
  workflow_dispatch:
    inputs:
      task:
        description: 'write / publish / stats / callbacks'
        required: true
        default: 'write'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run task
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          CRON="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python agent.py ${{ github.event.inputs.task }}
          elif [ "$CRON" = "0 2 * * *" ]; then
            python agent.py write
          elif [ "$CRON" = "0 18 * * *" ]; then
            python agent.py stats
          elif [ "$CRON" = "*/15 * * * *" ]; then
            python agent.py callbacks
          fi
